services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: geekjobs-app

    ports:
      - "8000:80"

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


  mysql:
    image: mysql:8.4

    container_name: geekjobs-mysql

    environment:
      MYSQL_DATABASE: portaljob
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: geekjobs
      MYSQL_PASSWORD: geekjobs_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-ugeekjobs",
          "-pgeekjobs_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped


volumes:
  mysql_data: